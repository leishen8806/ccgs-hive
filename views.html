<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/drlife-logo-mark.png">
<title>Dr.life+ · 作战视图</title>
<style>
:root{--bg:#070b0e;--panel:#0c1418;--line:#1d2c33;--ink:#e9eef0;--muted:#8299a1;--dim:#4f646c;--amber:#f0c27b;--amber2:#ffdca3;--blue:#9fd3ea;--teal:#3fd6b0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#030507;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden}
.num{font-family:Bahnschrift,"DIN Alternate","Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.mono{font-family:Consolas,"JetBrains Mono",monospace}

header{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line);background:#081014}
.brand{display:flex;align-items:center;gap:10px;font:600 17px/1 Bahnschrift,"Segoe UI",sans-serif;letter-spacing:.08em;white-space:nowrap}
.brand-logo{height:40px;width:auto;object-fit:contain}
.brand b{color:var(--amber)} .brand span{color:var(--muted);font-weight:400}
nav{display:flex;margin-left:8px}
nav button,nav a{height:63px;display:flex;align-items:center;padding:0 13px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
nav button:hover,nav a:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--amber)}
nav kbd{font:10px Consolas,monospace;color:var(--dim);margin-left:5px}
.sp{flex:1}
.badge{font-size:12px;color:var(--amber);border:1px solid rgba(240,194,123,.4);background:rgba(240,194,123,.08);padding:5px 11px;border-radius:999px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blink 1.6s infinite}
.badge.demo{color:#b9a8ec;border-color:rgba(185,168,236,.4);background:rgba(185,168,236,.08)} .badge.demo i{background:#b9a8ec;box-shadow:0 0 8px #b9a8ec}
@keyframes blink{50%{opacity:.3}}
.ctrl{display:flex;gap:8px;align-items:center}
.ctrl select,.ctrl button{height:32px;background:#101b21;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:13px;cursor:pointer}
.ctrl select:hover,.ctrl button:hover{border-color:var(--blue)}
.ctrl label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.ctrl input{accent-color:var(--amber)}
#clock{font-size:22px;color:#cdeefa;line-height:1.1;text-align:right;min-width:104px}
#clock small{display:block;font-size:11px;color:var(--muted);font-family:"Microsoft YaHei",sans-serif}

#sub{position:absolute;top:64px;left:0;right:0;height:52px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--line);gap:20px;background:#070d10}
.crumb{font-size:19px;color:var(--muted);white-space:nowrap} .crumb b{color:var(--ink);font-weight:600}
.vsub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;margin-left:auto}
.stat{padding:0 15px;border-left:1px solid var(--line);text-align:center;min-width:76px}
.stat b{display:block;font-size:19px;font-weight:500;line-height:1.1}
.stat span{font-size:11px;color:var(--muted);white-space:nowrap}
.stat.t b{color:var(--teal)} .stat.a b{color:var(--amber)} .stat.r b{color:#eba9a1} .stat.v b{color:#b9a8ec}

#main{position:absolute;top:116px;left:0;width:1920px;height:852px;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:1920px;height:852px}
#mesh{position:absolute;left:0;top:0;width:1920px;height:852px;display:none;background:radial-gradient(ellipse 900px 600px at 1100px 430px,rgba(63,214,176,.05),transparent 70%),#070b0e}
#mesh-svg,#mesh-cv{position:absolute;left:0;top:0;width:1920px;height:852px}
#mesh-cv{pointer-events:none}
#mesh-html{position:absolute;left:0;top:0;width:1920px;height:852px;pointer-events:none}
#mesh-html>*{pointer-events:auto}
#legend{position:absolute;max-width:700px;font-size:12px;color:var(--muted);background:rgba(7,11,14,.78);border:1px solid var(--line);border-radius:6px;padding:7px 12px;line-height:1.6;pointer-events:none;z-index:6}
#legend b{color:var(--ink);font-weight:500}

#log{position:absolute;top:968px;left:0;right:0;height:112px;border-top:1px solid var(--line);background:#05090b;padding:9px 24px;font:12px/1.65 Consolas,"JetBrains Mono",monospace;overflow:hidden}
.lr{display:grid;grid-template-columns:150px 92px 1fr 220px;gap:14px;color:#5d7880;white-space:nowrap}
.lr:first-child{color:#d6e7ec}
.lr>span{overflow:hidden;text-overflow:ellipsis}
.lr .k{color:var(--teal)} .lr .k.done{color:var(--amber)} .lr .k.demo{color:#b9a8ec} .lr .k.other{color:var(--muted)}
.lr .r{text-align:right}
.lr.empty{color:var(--dim)}

#tip{position:absolute;pointer-events:none;z-index:30;max-width:360px;padding:9px 12px;border-radius:8px;background:rgba(6,12,15,.96);border:1px solid var(--blue);font-size:12px;line-height:1.7;opacity:0;transition:opacity .12s;box-shadow:0 0 18px rgba(159,211,234,.18)}
#tip h4{font-size:14px;font-weight:500;color:var(--amber);margin-bottom:2px}
#tip span{color:var(--muted)}
#err{position:absolute;inset:0;display:none;flex-direction:column;gap:12px;align-items:center;justify-content:center;font-size:20px;color:var(--amber);background:rgba(3,5,7,.95);z-index:50;text-align:center}
#err code{font:15px Consolas,monospace;color:#cdeefa;background:rgba(159,211,234,.1);padding:6px 12px;border-radius:6px}
#err p{font-size:14px;color:var(--muted)}

/* mesh html */
.spill{position:absolute;left:30px;width:118px;height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:#d5dee1;color:#0a1216;border-radius:2px;font:600 11px Consolas,monospace;letter-spacing:.03em;cursor:pointer}
.spill em{font-style:normal;font-weight:400;color:#47595f;font-size:10px}
.spill.on{background:#3fd6b0;box-shadow:0 0 14px rgba(63,214,176,.6)}
.spill.rel{background:#f0c27b}
.pill{position:absolute;left:650px;width:190px;height:15px;display:flex;align-items:center;gap:6px;padding:0 6px 0 1px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:8px;background:#0b1317;font-size:11px;line-height:1;color:#c9d6da;cursor:pointer;white-space:nowrap;overflow:hidden}
.pill .pb{flex:none;font:600 9px/13px Consolas,monospace;padding:0 4px;border-radius:6px;background:var(--c);color:#071014}
.pill .pn{overflow:hidden;text-overflow:ellipsis}
.pill .pr{margin-left:auto;font:9px Consolas,monospace;color:var(--amber)}
.pill.ran{border-color:var(--amber)}
.pill.act{background:color-mix(in srgb,var(--c) 30%,#0b1317);box-shadow:0 0 12px var(--c);color:#fff}
.pill.rel{background:color-mix(in srgb,var(--c) 18%,#0b1317);color:#fff}
.pill.dim,.tag.dim,.spill.dim{opacity:.28}
.card{position:absolute;width:250px;border:1px solid var(--amber);border-radius:9px;background:#0b1317;padding:10px 13px;font-size:11px;color:var(--muted);line-height:1.45;box-shadow:0 0 22px rgba(240,194,123,.07)}
.card.sp{border-color:#5d7880}
.card .ct{display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-size:14px;font-weight:600}
.card .ok{width:20px;height:20px;border-radius:4px;background:var(--amber);color:#0b1317;display:flex;align-items:center;justify-content:center;font-size:12px}
.card.sp .ok{background:#5d7880;color:#e9eef0}
.card .cs{font:10px Consolas,monospace;color:var(--dim);margin-bottom:6px}
.card .tg{display:flex;align-items:center;gap:6px;color:#9fd3ea;margin-bottom:6px}
.card .tg i{width:22px;height:11px;border-radius:6px;background:#2f7fd0;position:relative}
.card .tg i::after{content:"";position:absolute;right:2px;top:2px;width:7px;height:7px;border-radius:50%;background:#fff}
.card .cl{font-size:9px;color:var(--dim);margin-top:5px}
.card .cv{color:#c9d6da}
.card .cv code{font:10px Consolas,monospace;background:#1d2a30;color:#9fd3ea;padding:0 4px;border-radius:3px}
.card .cf{text-align:right;font-size:10px;color:var(--dim);margin-top:6px}
.tag{position:absolute;width:206px;height:18px;padding:0 6px;display:flex;align-items:center;gap:6px;font:11px Consolas,"Microsoft YaHei",monospace;background:#18232a;color:#9fb3ba;border-radius:2px;white-space:nowrap;overflow:hidden;cursor:pointer}
.tag em{font-style:normal;font-size:9px;color:var(--dim);flex:none}
.tag span{overflow:hidden;text-overflow:ellipsis}
.tag.art{background:#3a2f1c;color:var(--amber2)}
.tag.art em{color:var(--amber)}
.tag.rel{background:#24414a;color:#e9eef0}
.tag.hot{background:#f0c27b;color:#0b1317}
.tag.hot em{color:#5a4320}
.hub-l{position:absolute;left:198px;top:478px;width:104px;text-align:center;font:600 10px Consolas,monospace;letter-spacing:.06em;color:#0b1317;background:#d5dee1;border-radius:2px;padding:2px 0;pointer-events:none}
.col-h{position:absolute;top:-2px;font:10px Consolas,monospace;color:var(--dim);letter-spacing:.06em;pointer-events:none}
#mesh-svg path{fill:none}
#mesh-svg .e{stroke-width:.8;opacity:.22;transition:opacity .15s}
#mesh-svg.focus .e{opacity:.035}
#mesh-svg.focus .e.hl{opacity:.85;stroke-width:1.3}
#mesh-svg .e.hot{opacity:.75;stroke-width:1.2}
#mesh-svg .tmp{stroke:#3fd6b0;stroke-width:1.4;opacity:.9;stroke-dasharray:4 4}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="brand"><img class="brand-logo" src="assets/drlife-logo.png" alt="Dr.life+" onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement('b'),{textContent:'Dr.life+'}))"><span>AGENT VIEWS</span></div>
    <nav id="nav"></nav>
    <div class="sp"></div>
    <span class="badge" id="badge"><i></i><span id="badge-t">—</span></span>
    <div class="ctrl">
      <select id="sel-mode" aria-label="数据模式"><option value="replay">回放真实记录</option><option value="demo">演示调度</option></select>
      <button id="btn-play">暂停</button>
      <select id="sel-speed" aria-label="速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
      <label><input type="checkbox" id="chk-rotate">轮换 30s</label>
      <label><input type="checkbox" id="chk-reduce">减少动效</label>
    </div>
    <div id="clock" class="num">--:--:--<small id="clock-s">—</small></div>
  </header>

  <div id="sub">
    <div class="crumb">global / <b>ccgs49-studio</b></div>
    <div class="vsub" id="vsub">—</div>
    <div class="stats">
      <div class="stat"><b class="num" id="s-roles">49</b><span>岗位</span></div>
      <div class="stat t"><b class="num" id="s-active">0</b><span id="s-active-l">运行中</span></div>
      <div class="stat a"><b class="num" id="s-done">0</b><span id="s-done-l">已完成运行</span></div>
      <div class="stat"><b class="num" id="s-inputs">0</b><span>输入</span></div>
      <div class="stat"><b class="num" id="s-collab">0</b><span>协作关系</span></div>
      <div class="stat v"><b class="num" id="s-evals">0</b><span>评测 已执行/总数</span></div>
      <div class="stat"><b class="num" id="s-flows">0</b><span>工作流</span></div>
    </div>
  </div>

  <div id="main">
    <canvas id="cv"></canvas>
    <div id="mesh">
      <svg id="mesh-svg" viewBox="0 0 1920 852"></svg>
      <canvas id="mesh-cv"></canvas>
      <div id="mesh-html"></div>
    </div>
    <div id="legend"></div>
  </div>

  <div id="log"></div>
  <div id="tip"></div>
  <div id="err"></div>
</div>

<script src="ccgs49-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fail(html){ const e=$('err'); e.innerHTML=html; e.style.display='flex'; }
if(!window.CCGS49){ fail('未找到岗位数据 ccgs49-data.js<p>本页需和 ccgs49-data.js 放在同一文件夹（ccgs-hive）。在该文件夹运行：</p><code>python build_data.py</code>'); return; }
if(!window.d3){ fail('可视化组件 D3 未加载<p>请联网后重新打开本页</p>'); return; }

/* ================= 数据 ================= */
const D=window.CCGS49;
const ROLES=D.roles, SOURCES=D.sources, FLOWS=D.workflows||[];
const roleById=Object.fromEntries(ROLES.map(r=>[r.id,r])), roleBySlug=Object.fromEntries(ROLES.map(r=>[r.slug,r]));
const srcById=Object.fromEntries(SOURCES.map(s=>[s.id,s]));
ROLES.forEach(r=>r.inputs.forEach(i=>{ if(!srcById[i.src]) i.src=SOURCES[0].id; }));
const GROUPS=[...new Set(ROLES.map(r=>r.group))];
const GPAL=['#ffdca3','#f0c27b','#7fd3ea','#b9a8ec','#8fd8ba','#eba9a1','#c9d48a'];
const gcol=g=>GPAL[GROUPS.indexOf(g)%GPAL.length];
const num=id=>String(id).replace(/\D+/g,'');
const srcUsers={}; SOURCES.forEach(s=>srcUsers[s.id]=new Set()); ROLES.forEach(r=>r.inputs.forEach(i=>srcUsers[i.src].add(r)));
const ARTS=(D.runs&&D.runs.artifacts)||{};
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const MW=1920, MH=852, TAU=Math.PI*2;

/* ================= 回放时间轴（真实 agent-audit.log） ================= */
const RATE=20, GAP_MAX=1500;
function buildReplay(){
  const raw=(D.runs&&D.runs.runs)||[];
  const runs=raw.map((r,i)=>({...r,i,s:Date.parse(r.start),e:r.end?Date.parse(r.end):null,role:r.roleId?roleById[r.roleId]||null:null})).filter(r=>Number.isFinite(r.s));
  if(!runs.length) return null;
  const last=Math.max(...runs.map(r=>r.e||r.s));
  runs.forEach(r=>{ r.eEff=r.e||last; });
  const pts=[...new Set(runs.flatMap(r=>[r.s,r.eEff]))].sort((a,b)=>a-b);
  const map=[{t:pts[0],p:0}]; let p=0;
  for(let i=1;i<pts.length;i++){ const t0=pts[i-1],t1=pts[i],dt=t1-t0; const active=runs.some(r=>r.s<=t0&&r.eEff>=t1); p+=active?dt/RATE:Math.min(GAP_MAX,dt/RATE); map.push({t:t1,p}); }
  const toP=t=>{ if(t<=map[0].t) return 0; for(let i=1;i<map.length;i++) if(t<=map[i].t){ const a=map[i-1],b=map[i]; return a.p+(b.p-a.p)*((t-a.t)/((b.t-a.t)||1)); } return map[map.length-1].p; };
  const toT=pp=>{ if(pp<=0) return map[0].t; for(let i=1;i<map.length;i++) if(pp<=map[i].p){ const a=map[i-1],b=map[i]; return a.t+(b.t-a.t)*((pp-a.p)/((b.p-a.p)||1)); } return map[map.length-1].t; };
  runs.forEach(r=>{ r.ps=toP(r.s); r.pe=toP(r.eEff); });
  const events=((D.runs&&D.runs.events)||[]).map(e=>({...e,ms:Date.parse(e.t)})).filter(e=>Number.isFinite(e.ms)).map(e=>({...e,p:toP(e.ms),role:e.roleId?roleById[e.roleId]:null})).sort((a,b)=>a.p-b.p);
  return {runs,events,toP,toT,total:p,t0:pts[0],t1:last};
}
const RP=buildReplay();
const hm=ms=>{ const d=new Date(ms); return d.toTimeString().slice(0,8); };
const dur=s=>{ s=Math.round(s); return s>=3600?Math.floor(s/3600)+'小时'+Math.floor(s%3600/60)+'分':s>=60?Math.floor(s/60)+'分'+(s%60)+'秒':s+'秒'; };

/* ================= 几何工具 ================= */
function mkPoly(pts){ const P=[pts[0]]; for(let i=1;i<pts.length;i++){ const a=P[P.length-1],b=pts[i]; if(Math.hypot(b.x-a.x,b.y-a.y)>.01) P.push(b); } const cum=[0]; for(let i=1;i<P.length;i++) cum.push(cum[i-1]+Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y)); return {pts:P,cum,len:cum[cum.length-1]||1}; }
function at(poly,f,off=0){ const P=poly.pts; if(P.length<2) return {x:P[0].x,y:P[0].y,ang:0};
  const L=Math.max(0,Math.min(1,f))*poly.len; let lo=0,hi=poly.cum.length-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(poly.cum[m]<L) lo=m; else hi=m; }
  const a=P[lo],b=P[hi],seg=(poly.cum[hi]-poly.cum[lo])||1,k=(L-poly.cum[lo])/seg,ang=Math.atan2(b.y-a.y,b.x-a.x);
  return {x:a.x+(b.x-a.x)*k-Math.sin(ang)*off,y:a.y+(b.y-a.y)*k+Math.cos(ang)*off,ang}; }
function quad(p0,c,p1,n=24){ const o=[]; for(let i=0;i<=n;i++){ const t=i/n,u=1-t; o.push({x:u*u*p0.x+2*u*t*c.x+t*t*p1.x,y:u*u*p0.y+2*u*t*c.y+t*t*p1.y}); } return o; }
function cubic(p0,p1,p2,p3,n=28){ const o=[]; for(let i=0;i<=n;i++){ const t=i/n,u=1-t; o.push({x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y}); } return o; }
function hcurve(x1,y1,x2,y2,k=.5,n=28){ const dx=(x2-x1)*k; return cubic({x:x1,y:y1},{x:x1+dx,y:y1},{x:x2-dx,y:y2},{x:x2,y:y2},n); }
function hpath(x1,y1,x2,y2,k=.5){ const dx=(x2-x1)*k; return `M${x1},${y1}C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`; }
function catmull(pts,n=18){ const P=[pts[0],...pts,pts[pts.length-1]],o=[]; for(let i=1;i<P.length-2;i++){ const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2]; for(let k=0;k<n;k++){ const t=k/n,t2=t*t,t3=t2*t; o.push({x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)}); } } o.push(pts[pts.length-1]); return o; }
function chamfer(pts,c=13){ const P=mkPoly(pts).pts; if(P.length<3) return P; const o=[P[0]]; for(let i=1;i<P.length-1;i++){ const a=P[i-1],b=P[i],n=P[i+1],d1=Math.hypot(b.x-a.x,b.y-a.y),d2=Math.hypot(n.x-b.x,n.y-b.y),k1=Math.min(c,d1/2),k2=Math.min(c,d2/2); o.push({x:b.x-(b.x-a.x)/d1*k1,y:b.y-(b.y-a.y)/d1*k1},{x:b.x+(n.x-b.x)/d2*k2,y:b.y+(n.y-b.y)/d2*k2}); } o.push(P[P.length-1]); return o; }
function strokePts(g,pts){ g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)); g.stroke(); }
const spriteCache={};

/* ================= 活动引擎：智能体（真实回放 / 演示调度） ================= */
const T_OUT=1.9, T_COL=1.3, T_BACK=1.9;

  if(a.state==='out'){ a.frac=Math.min(1,a.t/T_OUT); if(a.t>=T_OUT){ a.state='collect'; a.t=0; a.dur=T_COL*(.8+Math.random()*.5); } }
  else if(a.state==='collect'){ srcHeat[a.src]=1; if(a.t>=a.dur){ a.state='back'; a.t=0; meshInbound(a); } }
  else if(a.state==='back'){ a.frac=Math.max(0,1-a.t/T_BACK); if(a.t>=T_BACK){ arrive(a); } }

  while(evPtr<RP.events.length&&RP.events[evPtr].p<=playMs){ const e=RP.events[evPtr++];
    const nm=e.role?`${e.role.id} ${e.role.name}`:`${e.agent}（非岗位 agent）`, who=e.role?e.role.id:e.agent;
    if(e.kind==='start') addLog({time:e.ms,k:e.role?'start':'other',who,txt:`▶ ${nm} 开始运行`,right:'会话 '+String(e.session).slice(0,8)});
    else { const run=RP.runs.find(r=>r.e===e.ms&&r.agent===e.agent&&r.session===e.session); const sec=run?(run.e-run.s)/1000:null; const arts=e.role?(ARTS[e.role.slug]||[]):[];
      addLog({time:e.ms,k:e.role?'done':'other',who,txt:`✓ ${nm} 运行完成${sec!=null?' · 用时 '+dur(sec):''}${arts.length?' · 产出 '+arts.map(a=>a.path.split('/').pop()).join('、'):''}`,right:'会话 '+String(e.session).slice(0,8)}); } }

  if(DM.run.length<3&&DM.cool<=0&&FLOWS.length){ const f=FLOWS[DM.next++%FLOWS.length]; if(!DM.run.some(w=>w.f===f)){ const ags=f.roles.map(id=>roleById[id]).filter(Boolean).map((r,i)=>newAgent(r,{delay:i*.5,flow:f})); DM.run.push({f,agents:ags}); addLog({time:Date.now(),k:'demo',who:f.id,txt:`▶ ${f.name} 派工 · ${ags.length} 岗`,right:'演示'}); } DM.cool=2.4; } }

const parts=[];
function stepParts(dt){ for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt;
  if(p.type==='mdot'){ p.f+=p.v*dt; if(p.f>=1) p.life=0; }
  else if(p.type==='drop'){ const tp=p.a.pos||p; p.x+=(tp.x-p.x)*Math.min(1,dt*4); p.y+=(tp.y-p.y)*Math.min(1,dt*4); }
  else { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.95; p.vy*=.95; }
  if(p.life<=0) parts.splice(i,1); } }
function meshInbound(a){ if(currentTheme()!==MESH||reduced) return; const poly=meshPolys.in[a.role.id]&&meshPolys.in[a.role.id][a.src]; if(!poly) return; for(let k=0;k<4;k++) parts.push({type:'mdot',poly,f:-k*.06,v:.55,life:3,rgb:'63,214,176',size:2.2}); }
function meshOutbound(a){ if(currentTheme()!==MESH||reduced) return; for(const d of meshPolys.dv[a.role.id]||[]) parts.push({type:'mdot',poly:d.poly,f:0,v:.7,life:2,rgb:'240,194,123',size:2,tag:d.tag}); for(const poly of (meshPolys.co[a.role.id]||[]).slice(0,6)) parts.push({type:'mdot',poly,f:0,v:.6,life:2.2,rgb:'159,211,234',size:1.6}); }

/* ================= 渲染 ================= */
const VIEWS=[MESH,GALAXY,LEAF,PCB,CAVE,FACTORY,NEURAL];
let view=VIEWS[0]; const currentTheme=()=>view;
const meshCv=$('mesh-cv'), mctx=meshCv.getContext('2d');
function centerText(){ return mode==='replay'?`已完成运行 ${doneRuns()}（真实）`:`演示归集 ${deposits}`; }
function themePos(a,th){ if(th.mesh||!a.src||a.state==='wait') return null; const poly=th.paths[a.src]; if(!poly) return null; const f=a.state==='collect'?1:a.frac; const p=at(poly,f,a.lane*6); if(a.state==='collect'){ p.x+=Math.sin(simT*3+a.id)*4; p.y+=Math.cos(simT*4+a.id)*3-6; p.ang=-Math.PI/2; } else if(a.state==='back') p.ang+=Math.PI; return p; }
function renderTheme(dt){
  const th=view; ctx.setTransform(K,0,0,K,0,0); ctx.clearRect(0,0,MW,MH); ctx.drawImage(staticLayer,0,0,MW,MH);
  th.flash=Math.max(0,th.flash-dt*1.4);
  th.drawDyn(ctx,dt,simT);
  for(const a of agents){ a.pos=themePos(a,th); if(a.pos&&!reduced&&(a.state==='out'||a.state==='back')&&Math.random()<dt*50) parts.push({type:'trail',x:a.pos.x,y:a.pos.y,vx:-Math.cos(a.pos.ang)*18+(Math.random()-.5)*8,vy:-Math.sin(a.pos.ang)*18+(Math.random()-.5)*8,life:.7,max:.7,rgb:a.state==='back'?'240,194,123':th.col.trail,size:1+Math.random()*1.2});
    if(a.pos&&a.state==='collect'&&!reduced&&Math.random()<dt*8){ const n=th.nodes[a.src],an=Math.random()*TAU,d=(n.r||10)+6+Math.random()*16; parts.push({type:'drop',a,x:n.x+Math.cos(an)*d,y:n.y+Math.sin(an)*d,life:.9,max:.9,rgb:th.col.drop,size:1.8+Math.random()*1.4}); } }
  ctx.globalCompositeOperation='lighter'; for(const p of parts){ if(p.type==='mdot') continue; glowAt(ctx,p.rgb,p.x,p.y,p.size*4,Math.max(0,p.life/(p.max||1))*.9); } ctx.globalCompositeOperation='source-over';
  for(const a of agents){ if(!a.pos) continue; const look={...th.look,phase:simT+a.id,carry:a.state==='back'?th.col.carry:null};
    if(a.state!=='wait') glowAt(ctx,a.state==='back'?'240,194,123':th.col.trail,a.pos.x,a.pos.y,22,.35);
    (th.agent==='ship'?drawShip:th.agent==='bug'?drawBug:drawSpider)(ctx,a.pos.x,a.pos.y,a.pos.ang,look);
    if(a.state!=='collect') label(ctx,num(a.role.id),a.pos.x,a.pos.y+22,{size:10,font:'Consolas,monospace',color:'rgba(238,240,234,.85)',weight:400}); }
}
function renderMesh(dt){
  mctx.setTransform(K,0,0,K,0,0); mctx.clearRect(0,0,MW,MH);
  mctx.setLineDash([4,5]); mctx.lineDashOffset=-simT*30; mctx.lineWidth=1.5;
  for(const a of agents){ if(a.state!=='collect'&&a.state!=='back') continue; const poly=meshPolys.in[a.role.id]&&meshPolys.in[a.role.id][a.src]; if(!poly) continue; mctx.strokeStyle='rgba(63,214,176,.6)'; strokePts(mctx,poly.pts); }
  mctx.setLineDash([]); mctx.globalCompositeOperation='lighter';
  for(const p of parts){ if(p.type!=='mdot'||p.f<0) continue; const q=at(p.poly,p.f); glowAt(mctx,p.rgb,q.x,q.y,p.size*4,.95); if(p.tag&&p.f>.97) p.tag.hot=1; }
  mctx.globalCompositeOperation='source-over';
}
let meshUiAcc=0;
function meshUi(){ const act=new Set(agents.filter(a=>!a.dead&&a.state!=='wait').map(a=>a.role.id)); const col=new Set(agents.filter(a=>a.state==='collect').map(a=>a.src));
  for(const [id,p] of Object.entries(MESH.pillEl)) p.classList.toggle('act',act.has(id));
  for(const [id,p] of Object.entries(MESH.srcEl)) p.classList.toggle('on',col.has(id));
  for(const e of MESH.edges){ const r=e.getAttribute('data-r'); if(!r||!e.classList.contains('e-co')&&!e.classList.contains('e-dv')) continue; e.classList.toggle('hot',act.has(r.split(' ')[0])); }
  MESH.tagEl.forEach((el,k)=>{ const t=meshTags[k]; if(t.hot){ t.hot=Math.max(0,t.hot-.12); } el.classList.toggle('hot',!!t.hot&&t.hot>.05); }); }

/* ================= 日志 ================= */
const logRows=[]; const logEl=$('log');
function addLog(r){ logRows.unshift(r); if(logRows.length>5) logRows.length=5; renderLog(); }
function renderLog(){ logEl.innerHTML=logRows.length?logRows.map(r=>`<div class="lr"><span>${new Date(r.time).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})} ${hm(r.time)}</span><span class="k ${r.k==='done'?'done':r.k==='demo'?'demo':r.k==='other'?'other':''}">${esc(r.who)}</span><span>${esc(r.txt)}</span><span class="r">${esc(r.right||'')}</span></div>`).join(''):`<div class="lr empty"><span>—</span><span>—</span><span>${mode==='replay'?'等待回放到第一条真实事件…':'等待演示派工…'}</span><span></span></div>`; }

/* ================= 界面 ================= */
const nav=$('nav');
nav.innerHTML=VIEWS.map(v=>`<button data-view="${v.id}">${esc(v.name)}<kbd>${v.key}</kbd></button>`).join('')+'<a href="bigscreen.html" title="打开蜂巢大屏">蜂巢 ↗</a>';
nav.addEventListener('click',e=>{ const b=e.target.closest('[data-view]'); if(b) setView(VIEWS.find(v=>v.id===b.dataset.view)); });
addEventListener('keydown',e=>{ if(e.target.tagName==='SELECT') return; const v=VIEWS.find(v=>v.key===e.key); if(v) setView(v); });
function setView(v){ view=v; for(const b of nav.querySelectorAll('[data-view]')) b.classList.toggle('on',b.dataset.view===v.id);
  $('mesh').style.display=v.mesh?'block':'none'; $('mesh').classList.toggle('on',!!v.mesh); canvasEl.style.display=v.mesh?'none':'block';
  if(v.mesh) buildMesh(); else { if(!v.laid){ v.layout(); v.laid=true; } buildStatic(); }
  parts.length=0; $('vsub').textContent=v.sub; updateLegend(); hideTip(); rotateAcc=0; }
function updateLegend(){ const lg=$('legend'); Object.assign(lg.style,{left:'',right:'',top:'',bottom:'',maxWidth:''},{left:'20px',bottom:'14px'},view.lg?{left:'',bottom:''}:{},view.lg||{}); lg.innerHTML=view.legend+(mode==='replay'?'<br>运行起止时间来自 agent-audit.log（空闲压缩、运行中 20× 回放）；采集路线按岗位输入归类示意，日志不记录实际读了哪些输入。':'<br>演示调度：按 9 个团队工作流模拟派工，岗位并未实际运行。'); }
function buildStatic(){ if(view.mesh) return; staticLayer.width=Math.round(MW*K); staticLayer.height=Math.round(MH*K); sctx.setTransform(K,0,0,K,0,0); sctx.clearRect(0,0,MW,MH); view.drawStatic(sctx); }
const stage=$('stage'); let scale=1;
function fit(){ scale=Math.min(innerWidth/1920,innerHeight/1080); stage.style.transform=`translate(${(innerWidth-1920*scale)/2}px,${(innerHeight-1080*scale)/2}px) scale(${scale})`;
  K=scale*Math.min(devicePixelRatio||1,2); for(const c of [canvasEl,meshCv]){ c.width=Math.round(MW*K); c.height=Math.round(MH*K); } buildStatic(); }
addEventListener('resize',fit);

const modeSel=$('sel-mode'); if(!RP){ modeSel.querySelector('[value=replay]').disabled=true; modeSel.value='demo'; }
modeSel.value=mode;
modeSel.onchange=e=>{ mode=e.target.value; if(mode==='replay') resetReplay(); else resetDemo(); updateLegend(); renderLog(); };
$('btn-play').onclick=()=>{ playing=!playing; $('btn-play').textContent=playing?'暂停':'继续'; };
$('sel-speed').onchange=e=>speedMul=+e.target.value;
$('chk-reduce').checked=reduced; $('chk-reduce').onchange=e=>{ reduced=e.target.checked; parts.length=0; };
let rotateAcc=0;

const c0=D.meta.counts; $('s-roles').textContent=c0.roles; $('s-inputs').textContent=c0.inputs; $('s-collab').textContent=c0.collaboration; $('s-evals').textContent=c0.evalsRun+'/'+c0.evals; $('s-flows').textContent=c0.workflows;
function updateUi(){
  if(mode==='replay'){ const act=new Set(activeRuns().map(r=>r.roleId)); $('s-active').textContent=act.size; $('s-active-l').textContent='运行中岗位'; $('s-done').textContent=doneRuns(); $('s-done-l').textContent='已完成运行';
    const now=RP.toT(Math.min(playMs,RP.total)); $('badge').className='badge'; $('badge-t').textContent=`真实运行记录 · 回放 ${hm(RP.t0).slice(0,5)}–${hm(RP.t1).slice(0,5)}`; $('clock').firstChild.nodeValue=hm(now); $('clock-s').textContent='回放时刻 · '+new Date(now).toLocaleDateString('zh-CN'); }
  else { const act=new Set(agents.filter(a=>!a.dead&&a.state!=='wait').map(a=>a.role.id)); $('s-active').textContent=act.size; $('s-active-l').textContent='出勤岗位（演示）'; $('s-done').textContent=deposits; $('s-done-l').textContent='演示归集';
    $('badge').className='badge demo'; $('badge-t').textContent='演示调度 · 岗位未实际运行'; const d=new Date(); $('clock').firstChild.nodeValue=hm(d); $('clock-s').textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}); }
}

/* 悬停提示（画布主题） */
const tip=$('tip');
function showTip(e,html){ tip.innerHTML=html; tip.style.opacity=1; const sr=stage.getBoundingClientRect(); let x=(e.clientX-sr.left)/scale+16,y=(e.clientY-sr.top)/scale+16; if(x>1920-380)x-=396; if(y>1080-170)y-=170; tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.opacity=0; }
canvasEl.addEventListener('mousemove',e=>{ const r=canvasEl.getBoundingClientRect(), p={x:(e.clientX-r.left)/r.width*MW,y:(e.clientY-r.top)/r.height*MH};
  const a=agents.find(a=>a.pos&&Math.hypot(a.pos.x-p.x,a.pos.y-p.y)<20); if(a) return showTip(e,`<h4>${esc(a.role.id)} · ${esc(a.role.name)}</h4><span>${{out:'出发',collect:'采集中',back:'返回'}[a.state]||''}</span> ${esc(srcById[a.src]?.name||'')}<br><span>${mode==='replay'?'真实运行中 · 路线为输入归类示意':'演示 · '+esc(a.flow?.name||'')}</span>`);
  const th=view; for(const s of SOURCES){ const n=th.nodes[s.id]; if(n&&Math.hypot(n.x-p.x,n.y-p.y)<Math.max(22,(n.r||10)+8)) return showTip(e,`<h4>${esc(s.name)}</h4><span>归入的岗位输入</span> ${s.inputs} 条 · ${srcUsers[s.id].size} 个岗位<br><span>正在采集</span> ${agents.filter(a=>a.src===s.id&&a.state==='collect').map(a=>a.role.id).join('、')||'无'}`); }
  hideTip(); });
canvasEl.addEventListener('mouseleave',hideTip);

/* 主循环 */
let last=performance.now(), uiAcc=0;
function frame(now){ const raw=Math.min(.05,(now-last)/1000); last=now;
  if(playing){ const dt=raw*speedMul; simT+=dt;
    if(mode==='replay') replayStep(dt); else demoStep(dt);
    for(const a of agents) stepAgent(a,dt); for(let i=agents.length-1;i>=0;i--) if(agents[i].dead) agents.splice(i,1);
    for(const k in srcHeat) srcHeat[k]=Math.max(0,srcHeat[k]-dt*1.2);
    stepParts(dt);
    if($('chk-rotate').checked){ rotateAcc+=raw; if(rotateAcc>30) setView(VIEWS[(VIEWS.indexOf(view)+1)%VIEWS.length]); }
  }
  if(view.mesh){ renderMesh(raw); meshUiAcc+=raw; if(meshUiAcc>.12){ meshUiAcc=0; meshUi(); } } else renderTheme(playing?raw*speedMul:0);
  uiAcc+=raw; if(uiAcc>.25){ uiAcc=0; updateUi(); }
  requestAnimationFrame(frame); }
fit(); setView(VIEWS[0]); renderLog(); updateUi(); requestAnimationFrame(frame);
window.__views={setView:id=>setView(VIEWS.find(v=>v.id===id)),VIEWS,agents,get playMs(){return playMs},set playMs(v){playMs=v},setMode:m=>{modeSel.value=m;modeSel.onchange({target:modeSel});}};
})();
</script>
</body>

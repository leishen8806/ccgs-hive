<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智序控件目录</title>
<style>
:root{color-scheme:light dark;font:16px/1.5 system-ui,sans-serif;color:#172033;background:#f5f7fb}body{margin:0 auto;max-width:960px;padding:32px 20px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #d7ddea;padding-bottom:20px}h1{margin:0;font-size:28px}p{color:#526075}.themes{display:flex;gap:8px}.themes a,.component a{display:inline-block;border:1px solid #155eef;border-radius:8px;padding:8px 12px;color:#155eef;text-decoration:none}.themes a:first-child{background:#155eef;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:24px}.component{padding:18px;border:1px solid #d7ddea;border-radius:12px;background:#fff}.component h2{margin:0 0 8px}.tag{color:#067647;font-weight:700}.planned{color:#6b7280}@media(max-width:600px){body{padding:20px 16px}header{align-items:flex-start;flex-direction:column}.themes{width:100%}.themes a{flex:1;text-align:center}}
</style>
<body>
<header><div><h1>智序控件目录</h1><p>Web 控件基于 zxgc-kit 固定提交 133a183f 构建；选择主题进入真实渲染展示台。</p></div><nav class="themes" aria-label="主题"><a href="ui-kit.html?theme=light">浅色</a><a href="ui-kit.html?theme=dark">深色</a></nav></header>
<main class="grid">
<article class="component"><h2>Button</h2><b class="tag">可用</b><p>触发当前步骤的主要动作。</p><a href="ui-kit.html?theme=light">查看真实控件</a></article>
<article class="component"><h2>Input</h2><b class="tag">可用</b><p>收集短文本，并用标签说明内容。</p><a href="ui-kit.html?theme=light">查看真实控件</a></article>
<article class="component"><h2>Select</h2><b class="tag">可用</b><p>从有限选项中选择一个值。</p><a href="ui-kit.html?theme=light">查看真实控件</a></article>
<article class="component"><h2>Switch</h2><b class="tag">可用</b><p>即时切换独立开关。</p><a href="ui-kit.html?theme=light">查看真实控件</a></article>
<article class="component"><h2>Toast</h2><b class="tag">可用</b><p>反馈完成或需要注意的结果。</p><a href="ui-kit.html?theme=light">查看真实控件</a></article>
<article class="component"><h2>更多控件</h2><b class="planned">计划中</b><p>暂不提供空壳预览。</p></article>
</main>
</body>

<style>
#ccgs-hive-flow{--hf-bg:#10191e;--hf-panel:#17252d;--hf-raised:#23363e;--hf-ink:#f1eee6;--hf-muted:#b3c2c6;--hf-line:#3a515b;--hf-gold:#e6bf7b;--hf-blue:#94cce2;--hf-gold-soft:#3d3427;--hf-blue-soft:#203c49;--hf-scroll:#6a828b;background:var(--hf-bg);color:var(--hf-ink);font:14px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;border-radius:14px;overflow:clip;color-scheme:dark}
#ccgs-hive-flow *{box-sizing:border-box;scrollbar-color:var(--hf-scroll) var(--hf-bg);scrollbar-width:thin}
#ccgs-hive-flow [hidden]{display:none!important}
#ccgs-hive-flow h1,#ccgs-hive-flow h2,#ccgs-hive-flow h3,#ccgs-hive-flow p{margin:0}
#ccgs-hive-flow button,#ccgs-hive-flow select,#ccgs-hive-flow input{font:inherit;color:inherit}
#ccgs-hive-flow button{min-height:44px}
#ccgs-hive-flow button:disabled{opacity:.4}
#ccgs-hive-flow :focus-visible{outline:3px solid var(--hf-blue);outline-offset:3px}
#ccgs-hive-flow a{color:var(--hf-gold);text-underline-offset:3px;overflow-wrap:anywhere}
#ccgs-hive-flow ::-webkit-scrollbar{width:10px;height:10px}
#ccgs-hive-flow ::-webkit-scrollbar-track{background:var(--hf-bg)}
#ccgs-hive-flow ::-webkit-scrollbar-thumb{background:var(--hf-scroll);border:2px solid var(--hf-bg);border-radius:6px}
#ccgs-hive-flow ::-webkit-scrollbar-thumb:hover{background:var(--hf-muted)}
#ccgs-hive-flow ::-webkit-scrollbar-thumb:active{background:var(--hf-gold)}
#ccgs-hive-flow .hf-header{padding:20px 25px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--hf-line);flex-wrap:wrap}
#ccgs-hive-flow .hf-brand{display:flex;align-items:center;gap:16px}
#ccgs-hive-flow .hf-wordmark{font:600 24px/1.2 "Bahnschrift","Segoe UI",sans-serif;letter-spacing:.1em}
#ccgs-hive-flow .hf-title{border-left:1px solid var(--hf-line);padding-left:16px}
#ccgs-hive-flow h1{font-size:18px;font-weight:500;line-height:1.4}
#ccgs-hive-flow .hf-eyebrow{font-size:11px;letter-spacing:.08em;color:var(--hf-muted);margin-top:3px}

#ccgs-hive-flow .hf-toolbar{padding:15px 25px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--hf-line)}
#ccgs-hive-flow .hf-btn{min-width:44px;padding:8px 12px;background:var(--hf-panel);border:1px solid var(--hf-line);border-radius:6px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
#ccgs-hive-flow .hf-btn:hover{background:var(--hf-raised)}
#ccgs-hive-flow .hf-btn:active{transform:translateY(1px)}
#ccgs-hive-flow .hf-btn.hf-primary{min-width:105px;background:var(--hf-gold);color:var(--hf-bg);border-color:var(--hf-gold)}
#ccgs-hive-flow .hf-speed{display:flex;align-items:center;gap:7px;margin-left:4px;color:var(--hf-muted);font-size:12px}
#ccgs-hive-flow select{min-height:44px;background:var(--hf-panel);border:1px solid var(--hf-line);border-radius:6px;padding:8px 10px;max-width:100%}
#ccgs-hive-flow .hf-reduced{display:flex;align-items:center;gap:7px;min-height:44px;margin-left:auto;font-size:12px;color:var(--hf-muted)}
#ccgs-hive-flow .hf-reduced input{accent-color:var(--hf-gold);width:16px;height:16px}
#ccgs-hive-flow .hf-main{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;padding:20px 22px 22px;align-items:start}
#ccgs-hive-flow .hf-map-column{min-width:0}
#ccgs-hive-flow .hf-map-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
#ccgs-hive-flow h2{font-size:15px;font-weight:500}
#ccgs-hive-flow .hf-caption{font-size:11px;color:var(--hf-muted)}
#ccgs-hive-flow .hf-map{position:relative;isolation:isolate;border:1px solid var(--hf-line);background-color:var(--hf-panel);background-image:radial-gradient(var(--hf-line) .65px,transparent .65px);background-size:24px 24px;border-radius:9px;overflow:clip;min-height:340px}
#ccgs-hive-flow .hf-canvas,#ccgs-hive-flow .hf-grid-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ccgs-hive-flow .hf-grid-svg{z-index:0}
#ccgs-hive-flow .hf-canvas{z-index:2}
#ccgs-hive-flow .hf-cell{position:absolute;border:0;padding:2px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:44px;min-height:44px;z-index:1;border-radius:5px}
#ccgs-hive-flow .hf-cell:hover{background:rgba(148,204,226,.1)}

#ccgs-hive-flow .hf-cell[data-center=true] b{font-size:17px;color:var(--hf-gold)}
#ccgs-hive-flow .hf-cell[data-center=true] small{color:var(--hf-gold);font-variant-numeric:tabular-nums}
#ccgs-hive-flow .hf-cell[aria-pressed=true]{outline:1px solid var(--hf-blue);outline-offset:2px}
#ccgs-hive-flow .hf-bee{position:absolute;z-index:4;width:48px;height:56px;padding:0;border:0;border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center}
#ccgs-hive-flow .hf-bee:hover,#ccgs-hive-flow .hf-bee[aria-pressed=true]{background:rgba(148,204,226,.15)}

#ccgs-hive-flow .hf-bee span{position:absolute;bottom:-5px;padding:0 3px;border-radius:2px;background:var(--hf-bg);font:11px/1.3 Consolas,monospace;color:var(--hf-ink);pointer-events:none}
#ccgs-hive-flow .hf-cell[data-collecting=true] b,#ccgs-hive-flow .hf-cell[data-collecting=true] small{transform:translateY(var(--hf-label-offset))}
#ccgs-hive-flow .hf-map[data-compact=true] .hf-bee{width:44px;height:44px}
#ccgs-hive-flow .hf-map[data-compact=true] .hf-bee canvas{width:32px;height:32px}
#ccgs-hive-flow .hf-map[data-compact=true] .hf-bee span,#ccgs-hive-flow .hf-map[data-compact=true] .hf-cell small{display:none}
#ccgs-hive-flow .hf-map[data-compact=true] .hf-cell[data-center=true] small{display:block}
#ccgs-hive-flow .hf-canvas-caption{position:absolute;left:15px;top:12px;z-index:1;color:var(--hf-muted);font-size:11px;pointer-events:none}
#ccgs-hive-flow .hf-legend{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--hf-muted)}
#ccgs-hive-flow .hf-legend span{display:flex;align-items:center;gap:6px}
#ccgs-hive-flow .hf-swatch{display:inline-block;width:15px;height:2px;background:var(--hf-blue)}
#ccgs-hive-flow .hf-swatch.hf-gold{background:var(--hf-gold)}
#ccgs-hive-flow .hf-swatch.hf-dim{background:var(--hf-line)}
#ccgs-hive-flow .hf-seek-head{display:flex;justify-content:space-between;gap:15px;font-size:12px;margin-top:16px}
#ccgs-hive-flow .hf-seek-head output{color:var(--hf-gold);font-variant-numeric:tabular-nums}
#ccgs-hive-flow .hf-seek{width:100%;min-height:44px;margin:0;accent-color:var(--hf-gold);display:block}
#ccgs-hive-flow .hf-statusline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--hf-muted)}
#ccgs-hive-flow .hf-sidebar{border:1px solid var(--hf-line);border-radius:8px;background:var(--hf-panel);padding:18px;min-width:0}
#ccgs-hive-flow .hf-inspector-label{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--hf-muted);font-size:11px;margin-bottom:12px}
#ccgs-hive-flow .hf-tag{display:inline-block;padding:3px 7px;border-radius:4px;background:var(--hf-blue-soft);color:var(--hf-blue);font-size:11px;line-height:1.5}
#ccgs-hive-flow .hf-tag.hf-gold-tag{background:var(--hf-gold-soft);color:var(--hf-gold)}
#ccgs-hive-flow h3{font-size:20px;font-weight:500;line-height:1.5}
#ccgs-hive-flow .hf-code{font:11px/1.7 Consolas,"Cascadia Code",monospace;overflow-wrap:anywhere;color:var(--hf-muted)}
#ccgs-hive-flow .hf-description{font-size:13px;line-height:1.85;color:var(--hf-muted);margin-top:12px}
#ccgs-hive-flow .hf-kv{margin:16px 0;font-size:12px}
#ccgs-hive-flow .hf-kv>div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:9px;padding:9px 0;border-bottom:1px solid var(--hf-line)}
#ccgs-hive-flow dt{color:var(--hf-muted)}
#ccgs-hive-flow dd{margin:0;overflow-wrap:anywhere}
#ccgs-hive-flow .hf-check-note{font-size:12px;line-height:1.8;color:var(--hf-gold);padding:12px 0}
#ccgs-hive-flow details summary{display:flex;align-items:center;gap:8px;min-height:44px;font-size:12px;color:var(--hf-blue)}
#ccgs-hive-flow details summary::before{content:"＋"}
#ccgs-hive-flow details[open] summary::before{content:"−"}
#ccgs-hive-flow pre{font:11px/1.65 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:12px;background:var(--hf-bg);border-radius:5px;color:var(--hf-muted)}
#ccgs-hive-flow .hf-source-link{font-size:12px;display:flex;align-items:center;min-height:44px;margin-top:8px}
#ccgs-hive-flow .hf-receipts{border-top:1px solid var(--hf-line);margin-top:16px;padding-top:14px}
#ccgs-hive-flow .hf-receipt-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:8px}
#ccgs-hive-flow .hf-receipt-head span{color:var(--hf-gold)}
#ccgs-hive-flow .hf-empty{font-size:12px;line-height:1.85;color:var(--hf-muted);padding:8px 0}
#ccgs-hive-flow .hf-receipt{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;width:100%;padding:8px 0;border:0;border-bottom:1px solid var(--hf-line);background:transparent;font-size:11px}
#ccgs-hive-flow .hf-receipt:hover{background:var(--hf-raised)}
#ccgs-hive-flow .hf-receipt small{color:var(--hf-gold);font-size:11px}
#ccgs-hive-flow .hf-workbar{padding:0 22px 21px}
#ccgs-hive-flow .hf-work-title{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;align-items:center}
#ccgs-hive-flow .hf-workers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
#ccgs-hive-flow .hf-worker{display:flex;align-items:center;gap:10px;text-align:left;min-width:0;border:1px solid var(--hf-line);border-radius:6px;padding:10px;background:var(--hf-panel)}
#ccgs-hive-flow .hf-worker:hover{background:var(--hf-raised)}
#ccgs-hive-flow .hf-worker[aria-pressed=true]{border-color:var(--hf-blue)}
#ccgs-hive-flow .hf-worker-code{font:11px/1.3 Consolas,monospace;color:var(--hf-blue)}
#ccgs-hive-flow .hf-worker b{display:block;font-size:12px;font-weight:500}
#ccgs-hive-flow .hf-worker small{font-size:11px;color:var(--hf-muted);display:block}
#ccgs-hive-flow .hf-roster{border-top:1px solid var(--hf-line);padding:20px 22px 24px}
#ccgs-hive-flow .hf-roster-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;flex-wrap:wrap}
#ccgs-hive-flow .hf-roster-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
#ccgs-hive-flow .hf-roster-node{min-width:0;padding:9px 8px;display:flex;flex-direction:column;gap:5px;text-align:left;border:1px solid var(--hf-line);background:var(--hf-panel);border-radius:5px;min-height:64px}
#ccgs-hive-flow .hf-roster-node:hover{background:var(--hf-raised)}
#ccgs-hive-flow .hf-roster-node[aria-pressed=true]{border-color:var(--hf-blue);background:var(--hf-blue-soft)}
#ccgs-hive-flow .hf-roster-node[data-demo=true]{border-bottom-color:var(--hf-gold)}
#ccgs-hive-flow .hf-roster-node small{font:11px/1.3 Consolas,monospace;color:var(--hf-muted)}
#ccgs-hive-flow .hf-roster-node b{font-size:12px;font-weight:500;overflow-wrap:anywhere}
#ccgs-hive-flow .hf-footer{padding:13px 22px;border-top:1px solid var(--hf-line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--hf-muted);font-size:11px}
#ccgs-hive-flow .hf-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:900px){#ccgs-hive-flow .hf-main{grid-template-columns:minmax(0,1fr)}#ccgs-hive-flow .hf-sidebar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}#ccgs-hive-flow .hf-receipts{border-top:0;border-left:1px solid var(--hf-line);margin-top:0;padding:0 0 0 20px}#ccgs-hive-flow .hf-workers{grid-template-columns:repeat(4,minmax(0,1fr))}#ccgs-hive-flow .hf-roster-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:560px){#ccgs-hive-flow .hf-header{padding:16px;gap:10px}#ccgs-hive-flow .hf-toolbar{padding:12px 16px}#ccgs-hive-flow .hf-main{padding:16px 13px;gap:16px}#ccgs-hive-flow .hf-sidebar{display:block;padding:16px}#ccgs-hive-flow .hf-receipts{border-left:0;border-top:1px solid var(--hf-line);padding:14px 0 0;margin-top:15px}#ccgs-hive-flow .hf-reduced{margin-left:0}#ccgs-hive-flow .hf-cell b{font-size:11px}#ccgs-hive-flow .hf-cell small{font-size:11px}#ccgs-hive-flow .hf-cell[data-center=true] b{font-size:13px}#ccgs-hive-flow .hf-cell{gap:2px}#ccgs-hive-flow .hf-workers{grid-template-columns:repeat(2,minmax(0,1fr))}#ccgs-hive-flow .hf-workbar,#ccgs-hive-flow .hf-roster{padding:0 13px 20px}#ccgs-hive-flow .hf-roster{padding-top:18px}#ccgs-hive-flow .hf-roster-grid{grid-template-columns:repeat(4,minmax(0,1fr))}#ccgs-hive-flow .hf-work-title{align-items:start;flex-direction:column;gap:3px}#ccgs-hive-flow .hf-roster-top{gap:4px}#ccgs-hive-flow .hf-map-top{gap:8px}#ccgs-hive-flow .hf-map-top h2{font-size:14px}#ccgs-hive-flow .hf-footer{padding:13px 16px}#ccgs-hive-flow #hf-speed{font-size:16px}#ccgs-hive-flow .hf-demo{font-size:11px}#ccgs-hive-flow .hf-wordmark{font-size:22px}#ccgs-hive-flow .hf-title{padding-left:12px}#ccgs-hive-flow .hf-brand{gap:12px}}
@media(max-width:360px){#ccgs-hive-flow .hf-demo{width:100%}#ccgs-hive-flow .hf-roster-grid{grid-template-columns:repeat(3,minmax(0,1fr))}#ccgs-hive-flow .hf-cell small{display:none}#ccgs-hive-flow .hf-cell[data-center=true] small{display:block}#ccgs-hive-flow .hf-map-top{align-items:start;flex-direction:column;gap:2px}}
@media(prefers-reduced-motion:reduce){#ccgs-hive-flow *{animation:none!important;transition:none!important}}
@media(forced-colors:active){#ccgs-hive-flow *{scrollbar-color:auto}}
</style>
<div id="ccgs-hive-flow">
  <header class="hf-header"><div class="hf-brand"><span class="hf-wordmark">CCGS</span><div class="hf-title"><h1>蜂巢分工集群</h1><p class="hf-eyebrow">HIVE OPERATIONS / 49 个岗位</p></div></div><span class="hf-demo">演示模式 · 未连接真实运行</span></header>
  <div class="hf-toolbar" aria-label="蜂群演示控制">

  <main class="hf-main">

      <div class="hf-map" id="hf-map">
        <svg class="hf-grid-svg" id="hf-grid" role="img" aria-label="18 个演示资料源与中心归集仓的蜂巢布局"></svg>
        <canvas id="hf-trails" class="hf-canvas" aria-hidden="true"></canvas>

        <div id="hf-source-buttons"></div><div id="hf-bees"></div>
      </div>
      <div class="hf-legend"><span><i class="hf-swatch"></i>前往 / 采集中</span><span><i class="hf-swatch hf-gold"></i>携带数据返回</span><span><i class="hf-swatch hf-dim"></i>未参与本次演示</span></div>

    </aside>
  </main>
  <section class="hf-workbar" aria-label="八个演示工蜂"><div class="hf-work-title"><h2>本次参与的 8 个岗位</h2><span class="hf-caption">点击工蜂或岗位，暂停并查看详情</span></div><div id="hf-workers" class="hf-workers"></div></section>

      const p=positions[s.id],r=radius-3;
      return hexLine(d3.range(6).map(i=>{const angle=(30+i*60)*Math.PI/180;return[p.x+Math.cos(angle)*r,p.y+Math.sin(angle)*r];}));
    }).attr('stroke-width',s=>s.id==='center'?2:1);
    qa('[data-source]').forEach(b=>{const p=positions[b.dataset.source],w=Math.max(44,radius*1.4),h=Math.max(44,radius*1.25);b.style.width=w+'px';b.style.height=h+'px';b.style.left=(p.x-w/2)+'px';b.style.top=(p.y-h/2)+'px';});
    const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    const center=positions.center;
    jobs.forEach(j=>{
      const dest=positions[j.source],dx=dest.x-center.x,dy=dest.y-center.y,length=Math.hypot(dx,dy),nx=-dy/length,ny=dx/length;
      const bend=(j.index%2?1:-1)*radius*.55;
      const out=travelLine([[center.x,center.y],[(center.x+dest.x)/2+nx*bend,(center.y+dest.y)/2+ny*bend],[dest.x,dest.y]]);
      const back=travelLine([[dest.x,dest.y],[(center.x+dest.x)/2-nx*bend,(center.y+dest.y)/2-ny*bend],[center.x,center.y]]);
      const pathOut=document.createElementNS('http://www.w3.org/2000/svg','path'),pathBack=document.createElementNS('http://www.w3.org/2000/svg','path');
      pathOut.setAttribute('d',out);pathBack.setAttribute('d',back);paths[j.agent]={out:pathOut,back:pathBack,outLen:pathOut.getTotalLength(),backLen:pathBack.getTotalLength()};
    });
    paint();
  }
  function paint(){
    if(!positions.center)return;
    ctx.clearRect(0,0,width,height);
    const states=jobs.map(j=>({j,s:stateFor(j)})),delivered=states.filter(x=>x.s.stage==='done'),moving=states.filter(x=>['out','back'].includes(x.s.stage)).length;
    let collected=0;
    for(const {j,s} of states){
      const b=beeEls[j.agent],dest=positions[j.source],center=positions.center,p=paths[j.agent];
      let pos=center,heading=-Math.PI/2;
      const visible=!['idle','done'].includes(s.stage);
      b.hidden=!visible;
      if(s.stage==='out'||s.stage==='back'){
        const path=s.stage==='out'?p.out:p.back,len=s.stage==='out'?p.outLen:p.backLen;
        const ratio=reduced?(s.stage==='out'?1:0):s.p;
        pos=path.getPointAtLength(ratio*len);const ahead=path.getPointAtLength(Math.min(len,ratio*len+2)),behind=path.getPointAtLength(Math.max(0,ratio*len-2));
        heading=Math.atan2(ahead.y-behind.y,ahead.x-behind.x);
        if(!reduced){
          ctx.strokeStyle=s.stage==='back'?'rgba(230,191,123,.24)':'rgba(148,204,226,.18)';ctx.lineWidth=1;
          ctx.beginPath();for(let k=0;k<=28;k++){const v=path.getPointAtLength(len*k/28);if(k===0)ctx.moveTo(v.x,v.y);else ctx.lineTo(v.x,v.y);}ctx.stroke();
          for(let k=1;k<=9;k++){const t=Math.max(0,ratio-k*.02),pt=path.getPointAtLength(len*t);ctx.globalAlpha=(1-k/10)*.6;ctx.fillStyle=s.stage==='back'?colors.gold:colors.blue;ctx.beginPath();ctx.arc(pt.x,pt.y,1.7,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
        }
      }else if(s.stage==='collect'){
        pos={x:dest.x+(reduced?0:Math.cos(clock*2+j.index)*radius*.13),y:dest.y-radius*.55};heading=-Math.PI/2;
        if(!reduced)for(let k=0;k<3;k++){const t=(clock*.6+k/3)%1,angle=j.index+k*2.1;ctx.fillStyle=colors.gold;ctx.globalAlpha=1-t;ctx.beginPath();ctx.arc(dest.x+Math.cos(angle)*(1-t)*radius*.3,dest.y-radius*.1-t*radius*.3,2.3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
      }else if(s.stage==='drop'){
        pos={x:center.x,y:center.y-radius*.28};heading=Math.PI/2;
        if(!reduced){ctx.strokeStyle=colors.gold;ctx.globalAlpha=1-s.p;ctx.lineWidth=2;ctx.beginPath();ctx.arc(center.x,center.y,radius*.3+s.p*radius*.65,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
      }
      if(visible){b.style.left=(pos.x-(width<500?22:24))+'px';b.style.top=(pos.y-(width<500?22:28))+'px';drawBee(j,s,heading);}
      q('[data-source="'+j.source+'"]').dataset.collecting=String(s.stage==='collect');
      if(['back','drop','done'].includes(s.stage))collected++;
      q('[data-worker-state="'+j.agent+'"]').textContent=s.phase;
      q('[data-source-status="'+j.source+'"]').textContent=s.stage==='done'?'已归集':s.stage==='back'||s.stage==='drop'?'已采集':s.stage==='collect'?'采集中':'待采集';
    }
    svg.selectAll('path.hf-hex').attr('fill',s=>{
      if(s.id==='center')return '#393329';const j=jobBySource[s.id];if(!j)return '#142129';
      const st=stateFor(j).stage;return st==='collect'?'#254554':['back','drop','done'].includes(st)?'#39352b':'#1c303b';
    }).attr('stroke',s=>s.id==='center'?colors.gold:jobBySource[s.id]&&['collect','out'].includes(stateFor(jobBySource[s.id]).stage)?'#6e9caa':colors.line);
    const c=positions.center;
    for(let i=0;i<delivered.length;i++){const angle=(-90+i*45)*Math.PI/180;ctx.fillStyle=colors.gold;ctx.beginPath();ctx.arc(c.x+Math.cos(angle)*radius*.76,c.y+Math.sin(angle)*radius*.76,Math.max(2.5,radius*.055),0,Math.PI*2);ctx.fill();}
    q('[data-source-status="center"]').textContent=delivered.length+' / 8 包';
    q('#hf-counts').textContent='已归集 '+delivered.length+' 包 · 待核验 '+delivered.length+' 包';
    const percent=Math.round(clock/duration*100);q('#hf-percent').textContent=percent+'%';q('#hf-seek').value=String(Math.round(clock/duration*200));q('#hf-seek').setAttribute('aria-valuetext',percent+'%');
    q('#hf-receipt-count').textContent=delivered.length+' / 8';
    const key=delivered.map(x=>x.j.packet).join(',');
    if(key!==receiptKey||!q('#hf-receipt-list').children.length){
      q('#hf-receipt-list').innerHTML=delivered.length?delivered.map(({j})=>'<button type="button" class="hf-receipt cursor-interaction" data-receipt="'+j.agent+'"><span>'+esc(sourceById[j.source].name)+'<br><span class="hf-code">'+j.packet+'</span></span><small>待核验</small></button>').join(''):'<p class="hf-empty">还没有数据包归集。<br>工蜂返巢后会在这里留下记录。</p>';
      receiptKey=key;
    }
    const job=selection.type==='agent'?jobByAgent[selection.id]:jobBySource[selection.id];
    if(job&&q('#hf-selected-state')){
      const st=stateFor(job),hasPacket=['back','drop','done'].includes(st.stage);
      q('#hf-selected-state').textContent=st.phase;q('#hf-selected-packet').textContent=hasPacket?job.packet:'尚未采集完成';
      const phaseKey=job.agent+'|'+st.stage;
      if(phaseKey!==lastPhaseKey){
        q('#hf-packet-json').textContent=hasPacket?JSON.stringify({demo:true,packet_id:job.packet,agent_id:job.agent,source:sourceById[job.source].name,content_summary:job.payload,storage:st.stage==='done'?'center':'in_transit',verification:'pending'},null,2):'当前还没有生成数据包。';
        lastPhaseKey=phaseKey;
      }
    }
    root.dataset.clock=clock.toFixed(3);root.dataset.delivered=String(delivered.length);root.dataset.collected=String(collected);root.dataset.moving=String(moving);root.dataset.playing=String(playing);root.dataset.reduced=String(reduced);
  }
  function tick(t){
    frame=0;if(!playing)return;if(!lastTick)lastTick=t;const dt=Math.min(100,t-lastTick);lastTick=t;
    clock=Math.min(duration,clock+dt/1000*speed);paint();
    if(clock>=duration){pause();q('#hf-announcement').textContent='演示归集完成，8个数据包全部待核验。';return;}
    frame=requestAnimationFrame(tick);
  }
  function play(){if(clock>=duration)clock=0;playing=true;lastTick=0;controls();paint();if(!frame)frame=requestAnimationFrame(tick);}
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!root.contains(b))return;
    if(b.id==='hf-play'){if(playing)pause();else play();return;}
    if(b.id==='hf-restart'){pause();clock=0;paint();play();return;}
    if(b.id==='hf-next'){pause();const stops=[0,5,9,15,16,18.8,20];clock=stops.find(t=>t>clock+.01)??duration;paint();controls();q('#hf-announcement').textContent='已定位到演示进度'+Math.round(clock/duration*100)+'%';return;}
    if(b.dataset.bee){select('agent',b.dataset.bee);return;}
    if(b.dataset.agent){select('agent',b.dataset.agent);return;}
    if(b.dataset.source){select('source',b.dataset.source);return;}
    if(b.dataset.receipt){select('agent',b.dataset.receipt);}
  });
  q('#hf-seek').addEventListener('input',e=>{pause();clock=Number(e.target.value)/200*duration;paint();controls();});
  q('#hf-speed').addEventListener('change',e=>{speed=Number(e.target.value);q('#hf-announcement').textContent='回放速度已切换为'+speed+'倍';});
  q('#hf-reduced').addEventListener('change',e=>{reduced=e.target.checked;paint();controls();});
  preference.addEventListener('change',e=>{if(e.matches){reduced=true;q('#hf-reduced').checked=true;pause();paint();}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
  new ResizeObserver(()=>{const key=String(map.clientWidth);if(key!==sizeKey){sizeKey=key;layout();}}).observe(map);
  layout();renderInspector();updateSelection();controls();if(playing)frame=requestAnimationFrame(tick);
})();
</script>

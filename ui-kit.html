<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCGS HIVE · 控件规范</title><style>
:root{--brand:#1769aa;--surface:#fff;--surface2:#eef4f8;--ink:#17212b;--muted:#52606d;--line:#c7d2dc;--good:#147d4d;--radius:12px}html.dark{--brand:#7fc4f2;--surface:#14212b;--surface2:#1d303d;--ink:#eef5f8;--muted:#b4c5ce;--line:#496171;--good:#72d5a5}*{box-sizing:border-box}body{margin:0;background:var(--surface2);color:var(--ink);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}.shell{max-width:1480px;margin:auto;padding:24px}.topbar,.tabs,.subtabs,.toolbar,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.topbar{justify-content:space-between;margin-bottom:16px}.eyebrow{color:var(--brand);font-size:11px;letter-spacing:.16em;font-weight:800;margin:0}.title{font-size:32px;line-height:1.1;margin:4px 0}.subtitle,.muted{color:var(--muted)}button{font:inherit;color:inherit;cursor:pointer}.btn,.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}.btn.primary,.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 350px;gap:16px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 2px 8px #14212b1f}aside{padding:16px}.category{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;margin:4px 0;color:var(--muted)}.category.active{background:var(--surface2);color:var(--ink);font-weight:700;border-left:3px solid var(--brand)}.demo{padding:20px;min-height:620px}.toolbar{justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.toolbar h2{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}.card{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface2);text-align:left;color:var(--ink)}.card h3{margin:0 0 4px}.card p{margin:6px 0}.demo-box{display:grid;place-items:center;min-height:180px;text-align:center}.tag,.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;background:#147d4d22;color:var(--good)}.badge{min-width:28px;justify-content:center;background:var(--brand);color:#fff}.code{white-space:pre-wrap;overflow:auto;background:#0b1422;color:#d8e8ff;border-radius:9px;padding:12px;font:12px/1.5 ui-monospace,Consolas,monospace}.checklist{padding-left:18px}.checklist li{margin:5px 0}.source{font-size:12px;color:var(--muted)}.token-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.swatch{padding:10px;border-radius:8px;border:1px solid var(--line)}.swatch i{display:block;height:28px;border-radius:5px;margin-bottom:5px}.footer{color:var(--muted);font-size:12px;margin-top:18px}.notice{padding:10px 12px;border-radius:8px;background:#147d4d22;color:var(--good);margin:10px 0}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar nav{display:flex;overflow:auto}.category{white-space:nowrap;width:auto}.details{order:3}}@media(max-width:620px){.shell{padding:14px}.title{font-size:25px}.demo{padding:14px}}
</style></head><body><main class="shell"><header class="topbar"><div><p class="eyebrow">CCGS HIVE · UI KIT / STAGE 03</p><h1 class="title">控件规范</h1><p class="subtitle">统一令牌、数据驱动目录与跨端示例；仅为本地演示，不连接接口。</p></div><div class="row"><span class="tag">规范建议可识别</span><button class="btn" id="theme" type="button">深色模式</button></div></header><nav class="tabs" aria-label="平台切换"><button class="tab active" data-platform="web">Web admin</button><button class="tab" data-platform="h5">H5</button><button class="tab" data-platform="app">App</button></nav><nav class="subtabs hidden" id="apps" aria-label="App 技术栈"><button class="tab active" data-app="rn">React Native</button><button class="tab" data-app="flutter">Flutter</button></nav><div id="notice" class="notice hidden" role="status"></div><section class="layout"><aside class="panel sidebar"><h2>控件目录</h2><nav id="categories" aria-label="控件分类"></nav><button class="category" data-category="令牌">设计令牌</button><p class="footer">数据文件驱动：编号、分类、三端状态、来源与验收清单。</p></aside><section class="panel demo"><div class="toolbar"><div><h2 id="heading">Button · BTN-01</h2><p class="muted" id="summary">主/次/危险、图标、加载、禁用。</p></div><span class="tag" id="platformLabel">Web admin</span></div><div id="content"></div></section><aside class="panel details"><h2>规范与来源</h2><div id="details"><p class="muted">从左侧选择控件。</p></div></aside></section></main><script src="ui-kit-tokens.js"></script><script src="ui-kit-data.js"></script><script>
const $=s=>document.querySelector(s),controls=window.UI_CONTROLS;let platform='web',app='rn',selected=controls[0],category='基础';const categories=[...new Set(controls.map(x=>x.category))];function key(){return platform==='app'?app:platform}function stateLabel(x){return x.status.find(s=>s.toLowerCase().startsWith(key()))||'规范建议'}function renderCategories(){const count=c=>{const a=controls.filter(x=>x.category===c);return`${a.filter(x=>stateLabel(x).includes('完成')).length}/${a.length}`};$('#categories').innerHTML=categories.map(c=>`<button class="category ${category===c?'active':''}" data-category="${c}">${c} <span class="muted">${count(c)}</span></button>`).join('')}function render(){renderCategories();if(category==='令牌'){renderTokens();return}const list=controls.filter(x=>x.category===category);if(!list.includes(selected))selected=list[0];$('#heading').textContent=`${selected.name} · ${selected.id}`;$('#summary').textContent=selected.checks.join(' · ');$('#platformLabel').textContent=platform==='app'?`App · ${app==='rn'?'React Native':'Flutter'}`:platform==='web'?'Web admin':'H5';$('#content').innerHTML=`<div class="grid">${list.map(x=>`<button class="card" data-control="${x.id}"><h3>${x.id}</h3><p>${x.name}</p><p class="muted">${stateLabel(x)}</p></button>`).join('')}</div><div class="demo-box"><div><p class="muted">${selected.popup||'交互状态演示'}</p><button class="btn primary" id="demoButton">继续</button> <button class="btn">取消</button><p class="footer">${selected.id} · 不调用真实接口</p></div></div>`;$('#details').innerHTML=`<h3>验收清单</h3><ul class="checklist">${selected.checks.map(x=>`<li>${x}</li>`).join('')}<li>浅色/深色对比度：正文目标 ≥ 4.5:1</li><li>窄屏与键盘路径：待浏览器复核</li></ul><h3>代码示例</h3><pre class="code">${selected.code}</pre><p class="source">来源：${selected.source}</p>${selected.popup?`<p class="muted">${selected.popup}</p>`:''}`;document.querySelectorAll('[data-control]').forEach(b=>b.onclick=()=>{selected=controls.find(x=>x.id===b.dataset.control);render()});$('#demoButton')?.addEventListener('click',()=>{$('#notice').textContent='已触发本地演示事件 · 未调用接口';$('#notice').classList.remove('hidden');setTimeout(()=>$('#notice').classList.add('hidden'),1800)})}function renderTokens(){const t=window.UI_TOKENS;$('#heading').textContent='设计令牌';$('#summary').textContent='浅色/深色语义色、字号、间距、圆角、层级与动效时长。';$('#platformLabel').textContent='Tokens';$('#content').innerHTML=`<h3>语义色</h3><div class="token-grid">${Object.entries(t.light).map(([k,v])=>`<div class="swatch"><i style="background:${v}"></i>${k}<br><span class="muted">${v}</span></div>`).join('')}</div><h3>字号 / 间距 / 圆角 / 动效</h3><p>${t.type.join(' · ')}</p><p>${t.spacing.join(' · ')}</p><p>${t.radius.join(' · ')}</p><p>${t.motion.join(' · ')}</p>`;$('#details').innerHTML='<h3>对比度</h3><p>正文色板按 WCAG AA 目标设计：正文对比度 ≥ 4.5:1；实际页面截图复核待运行。</p><p class="muted">浅色与深色语义 token 均在 ui-kit-tokens.js。</p>'}document.querySelectorAll('[data-platform]').forEach(b=>b.onclick=()=>{platform=b.dataset.platform;document.querySelectorAll('[data-platform]').forEach(x=>x.classList.toggle('active',x===b));$('#apps').classList.toggle('hidden',platform!=='app');render()});document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>{app=b.dataset.app;document.querySelectorAll('[data-app]').forEach(x=>x.classList.toggle('active',x===b));render()});document.addEventListener('click',e=>{if(e.target.matches('[data-category]')){category=e.target.dataset.category;render()}});$('#theme').onclick=()=>{document.documentElement.classList.toggle('dark');$('#theme').textContent=document.documentElement.classList.contains('dark')?'浅色模式':'深色模式'};render();
</script><script>if(location.hash==='#dark')document.documentElement.classList.add('dark')</script></body></html>
